name: Test

# Every ICC app installs nex-shared from a pinned tag, so a broken release reaches an app only when it bumps — and
# then in the middle of its build. The types, the tests and the build run here first (DEV-240: the card's default
# inner spacing is guarded by test/card.test.mjs).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: The committed dist matches the source
        run: |
          npm run build
          git diff --exit-code -- dist/index.js dist/index.d.ts dist/tokens.css
